name: 手动构建 Padavan

on:
  workflow_dispatch:
    inputs:
      target:
        description: 机型模板名称
        type: string
        required: true
        default: RM2100

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: 检查机型并安装构建依赖
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET" =~ ^[A-Za-z0-9_-]+$ ]]
          test -f "trunk/configs/templates/$TARGET.config"
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-docutils unzip zip xz-utils \
            libtool-bin curl cmake gperf gawk flex bison xxd fakeroot kmod cpio bc ccache \
            gettext automake autopoint texinfo help2man pkg-config zlib1g-dev \
            libgmp-dev libmpc-dev libmpfr-dev libncurses-dev libltdl-dev wget libc-dev-bin
      - name: 构建所选机型
        shell: bash
        run: |
          set -euo pipefail
          make "$TARGET" 2>&1 | tee build.log
          sha256sum trunk/images/*.trx > firmware.sha256
      - name: 保存固件和构建日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: padavan-${{ inputs.target }}-${{ github.run_id }}
          path: |
            trunk/images/*.trx
            firmware.sha256
            build.log
          retention-days: 7
